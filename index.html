<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e7a4f">
<title>JajiGo v38 — Admin & AI Fix</title>
<style>
:root{--g:#0e7a4f;--g2:#0a5c3b;--g3:#e7f4ee;--o:#e2574c;--ink:#1c2420;--mut:#6b7770;--bg:#f6f5f1;--card:#fff;--line:#e4e2da;--gold:#f4b53f;--r:14px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;padding-bottom:78px;min-height:100vh;position:relative;overflow-x:hidden}
#app{position:relative;z-index:1}
header{position:sticky;z-index:20}
nav.tabs{z-index:30}
header{background:var(--g);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.3px}
.logo span{color:var(--gold)}
.loc{font-size:12.5px;opacity:.92;margin-top:1px;display:flex;align-items:center;gap:4px}
.iconbtn{background:rgba(255,255,255,.16);border:none;color:#fff;font-size:19px;width:40px;height:40px;border-radius:12px;position:relative;cursor:pointer}
.badge{position:absolute;top:4px;right:4px;background:var(--o);font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;color:#fff}
.searchwrap{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.searchbar{display:flex;align-items:center;background:#fff;border-radius:12px;padding:0 12px;height:46px;gap:8px}
.searchbar input{border:none;outline:none;flex:1;font-size:15px;height:100%;background:transparent;color:var(--ink)}
.aibtn{background:linear-gradient(135deg,#f4b53f,#e2574c);border:none;color:#fff;font-weight:700;font-size:14.5px;border-radius:12px;height:42px;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;width:100%}
.near-card{background:linear-gradient(135deg,#eaf8f0,#fff);border:1px solid #cfe9da;border-radius:16px;padding:14px;position:relative;overflow:hidden}.near-card:after{content:'📍';position:absolute;right:14px;top:10px;font-size:44px;opacity:.12}.near-title{font-size:17px;font-weight:800}.near-sub{font-size:12px;color:var(--mut);margin-top:3px}.near-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:11px}.near-chip{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 8px;font-size:12.5px;font-weight:700;text-align:center;cursor:pointer}.near-chip:active{transform:scale(.98)}.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#18a65b;box-shadow:0 0 0 4px rgba(24,166,91,.12);margin-right:5px}.mapbox{height:310px;border-radius:15px;overflow:hidden;border:1px solid var(--line);background:#eaf0eb}.mapbox .maploading{height:100%;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px}.near-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}.near-place{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.near-place .npname{font-weight:800;font-size:14px}.near-place .npmeta{font-size:11.5px;color:var(--mut);margin-top:2px}.distance{font-weight:800;color:var(--g)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:10.5px;color:var(--mut);cursor:pointer;position:relative}
nav.tabs button .ti{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--g);font-weight:700}
main{padding:14px 14px 20px;max-width:560px;margin:0 auto}
h2.sec{font-size:16.5px;font-weight:800;margin:18px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 6px;text-align:center;cursor:pointer;transition:transform .1s}
.cat:active{transform:scale(.97)}
.cat .ci{font-size:26px}
.cat .cn{font-size:12.5px;font-weight:600;margin-top:4px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .1s}
.pcard:active{transform:scale(.98)}
.pimg{height:120px;display:flex;align-items:center;justify-content:center;font-size:34px;background:#f3f0e8;position:relative;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pimg .pfav{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.92);border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;color:var(--g)}
.pimg .picon{font-size:56px}
.pbody{padding:9px 10px 11px}
.pname{font-size:13.5px;font-weight:700;line-height:1.25}
.psub{font-size:11.5px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pprice{font-size:14px;font-weight:800;color:var(--g);margin-top:4px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px;display:flex;gap:11px;align-items:center;cursor:pointer;transition:transform .1s}
.vcard:active{transform:scale(.98)}
.vlogo{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:25px;flex:none;color:#fff}
.vname{font-size:14.5px;font-weight:700}
.vmeta{font-size:12px;color:var(--mut);margin-top:1px}
.stars{color:var(--gold);font-size:12px}
.btn{background:linear-gradient(135deg,#16a34a 0%,#0e7a4f 55%,#0a5c3b 100%);color:#fff;border:none;border-radius:14px;height:48px;font-size:15.5px;font-weight:700;width:100%;cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .15s;box-shadow:0 8px 18px rgba(14,122,79,.22)}.btn.sec{background:var(--g3);color:var(--g);box-shadow:none}.btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(14,122,79,.27)}
.btn.sec{background:var(--g3);color:var(--g)}
.btn.warn{background:var(--o)}
.btn.sm{height:36px;font-size:13px;width:auto;padding:0 14px;border-radius:10px}
.btn:disabled{opacity:.5}
.btn:active{opacity:.85}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--g3);color:var(--g);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700}
.pill.red{background:#fdebe9;color:var(--o)}
.pill.amber{background:#fdf3e0;color:#a06514}
.pill.grey{background:#eee;color:#555}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.chip:active{transform:scale(.95)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.field{margin-bottom:12px}
.field label{font-size:13px;font-weight:700;display:block;margin-bottom:5px}
.field label .req{color:var(--o);margin-left:2px}
.field input,.field select,.field textarea{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:15px;background:#fff;outline:none;color:var(--ink);font-family:inherit}
.field textarea{height:80px;padding:10px 12px}
.field .charcount{font-size:11px;color:var(--mut);text-align:right;margin-top:3px}
.sec-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--g2);display:flex;align-items:center;gap:6px;margin:18px 0 8px}
.sec-title:first-of-type{margin-top:2px}
.sec-title .n{background:var(--g);color:#fff;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px}
.backlink{background:none;border:none;color:var(--g2);font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px;padding:6px 2px;margin-bottom:6px}
.terms-row{display:flex;align-items:flex-start;gap:9px;background:var(--g3);border-radius:12px;padding:10px 12px;margin:14px 0}
.terms-row input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--g)}
.terms-row span{font-size:12.5px;line-height:1.4}
.btn.loading{position:relative;color:transparent!important}
.btn.loading:after{content:'';position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.success-badge{width:74px;height:74px;border-radius:50%;background:var(--g3);color:var(--g);display:flex;align-items:center;justify-content:center;font-size:38px;margin:6px auto 14px}
.next-steps{list-style:none;text-align:left;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.next-steps li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.next-steps li .ni{background:var(--g3);color:var(--g);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.total-row{display:flex;justify-content:space-between;padding:5px 0;font-size:14.5px}
.total-row.big{font-weight:800;font-size:17px;border-top:1.5px solid var(--line);margin-top:5px;padding-top:11px}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:17px;font-weight:700;cursor:pointer;color:var(--g)}
.stepper button:active{background:var(--g3)}
.stepper span{min-width:34px;text-align:center;font-weight:700}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}
.empty .ei{font-size:44px;margin-bottom:8px}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:99;max-width:88%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.95}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--g);border-radius:50%;animation:sp .7s linear infinite;margin:24px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheet .inner{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-height:88%;overflow-y:auto;padding:16px 16px 26px;max-width:560px;margin:0 auto;animation:slideup .25s ease}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.grab{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 12px}
.msgrow{display:flex;margin-bottom:9px}
.msgrow.me{justify-content:flex-end}
.bub{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 12px;max-width:78%;font-size:14.5px;word-wrap:break-word}
.msgrow.me .bub{background:var(--g);color:#fff;border-color:var(--g)}
.aiprod{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;margin-top:7px}
.statusbar{display:flex;gap:4px;margin:12px 0}
.statusbar div{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .3s}
.statusbar div.on{background:var(--g)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th,table.tbl td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px}
.stat .sv{font-size:19px;font-weight:800;color:var(--g)}
.stat .sl{font-size:11.5px;color:var(--mut)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.h1{font-size:21px;font-weight:800;margin-bottom:4px}
.mut{color:var(--mut);font-size:13px}
.link{color:var(--g);font-weight:700;cursor:pointer}
.fav-heart{transition:transform .15s}
.fav-heart:active{transform:scale(1.3)}

/* JajiGo visual refresh — brand only (page background is owned by #jajigo-live-background-v33 below) */
:root{--bg:#f3f4f6;--bg-soft:#fbfcfd;--bg-glow:#eef1f5;--brand-dark:#172033;--brand-green:#16a34a;--brand-orange:#ff7a00}
main{min-height:calc(100vh - 78px);background:transparent}
.card,.cat,.pcard,.vcard,.stat{box-shadow:0 8px 24px rgba(23,32,51,.06)}
.sheet .inner{background:linear-gradient(180deg,#fbfcfd,#f1f3f6)}
.brand-logo{position:relative;display:inline-flex;align-items:baseline;font-family:Poppins,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-weight:800;letter-spacing:-1.2px;line-height:1;color:var(--brand-dark);white-space:nowrap}
.brand-logo .brand-jaji{color:var(--brand-dark)}
.brand-logo .brand-go{position:relative;color:var(--brand-green);margin-left:1px}
.brand-logo .brand-go::after{content:'➤';position:absolute;color:var(--brand-orange);font-size:.36em;font-weight:900;right:.03em;top:-.78em;transform:rotate(-18deg);line-height:1;text-shadow:0 1px 0 rgba(0,0,0,.04)}
.logo{font-size:22px;font-weight:inherit;letter-spacing:inherit}
.logo .brand-logo{font-size:1em}
.auth-brand{font-size:46px;margin-top:6px}

/* JajiGo provider registration: light floating marketplace background */
.provider-form-panel{position:relative;z-index:2;background:rgba(255,255,255,.90);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(22,139,69,.14);border-radius:22px;padding:16px;box-shadow:0 12px 35px rgba(0,0,0,.08)}
.provider-float-bg{position:absolute;inset:-8px;overflow:hidden;pointer-events:none;z-index:0;border-radius:24px;background:linear-gradient(145deg,rgba(239,252,245,.78),rgba(255,255,255,.92))}
.provider-float-bg span{position:absolute;left:calc((var(--i) * 17) % 100 * 1%);top:calc((var(--i) * 31) % 92 * 1%);font-size:clamp(22px,7vw,42px);opacity:.13;filter:saturate(.9);animation:jgFloatEmoji calc(9s + (var(--i) % 5) * 1.3s) ease-in-out infinite alternate;animation-delay:calc((var(--i) % 7) * -1s)}
@keyframes jgFloatEmoji{from{transform:translate3d(-5px,8px,0) rotate(-6deg)}to{transform:translate3d(8px,-10px,0) rotate(7deg)}}
.auth-main-card{position:relative;overflow:hidden}
.auth-main-tabs{display:flex;gap:7px;margin-bottom:10px}
.auth-main-tabs .chip{flex:1;min-height:44px}
.auth-role-tabs{display:flex;gap:7px;margin:8px 0 14px}
.auth-role-tabs .chip{flex:1;min-height:42px}
.auth-intro{background:var(--g3);border-radius:14px;padding:12px;margin-bottom:14px}
.auth-switch{text-align:center;margin-top:12px;font-size:13px}
.orline{display:flex;align-items:center;gap:8px;margin:14px 0;color:var(--muted,#777);font-size:12px}.orline:before,.orline:after{content:"";height:1px;background:var(--line);flex:1}.orline span{padding:0 4px}
.google-btn-wrap{display:flex;justify-content:center;min-height:44px}
@media(max-width:420px){.provider-form-panel{padding:13px}.provider-float-bg span{font-size:25px;opacity:.10}}
</style>

<style id="jajigo-smart-ai-tracking">
.smartchips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 5px;scrollbar-width:none}.smartchips::-webkit-scrollbar{display:none}.smartchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}.smartchip:active{transform:scale(.97)}.smartrec{background:linear-gradient(135deg,#eefaf4,#fff);border:1px solid #d5eee2;border-radius:14px;padding:11px;margin:8px 0}.smartrec .reason{font-size:11.5px;color:var(--mut);margin-top:2px}.trackmap{height:250px;border-radius:14px;overflow:hidden;background:#eef2ef;border:1px solid var(--line);margin-top:10px}.trackdot{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--g3);font-size:19px}.livebadge{display:inline-flex;align-items:center;gap:5px;background:#eaf8f0;color:var(--g);border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800}.livebadge i{width:7px;height:7px;border-radius:50%;background:#19a463;display:inline-block;animation:livepulse 1.3s infinite}@keyframes livepulse{50%{opacity:.35;transform:scale(.75)}}

<style id="jajigo-animated-background">
/* JajiGo living marketplace background — lightweight, self-contained, mobile-friendly */
body::before{
  content:"";position:fixed;inset:-18%;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 18% 22%,rgba(34,197,94,.13),transparent 28%),
    radial-gradient(circle at 82% 28%,rgba(16,185,129,.10),transparent 30%),
    radial-gradient(circle at 48% 88%,rgba(132,204,22,.08),transparent 34%);
  animation:jgBgDrift 24s ease-in-out infinite alternate;
}
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.045;
  background-image:radial-gradient(circle,rgba(22,163,74,.9) 1px,transparent 1.5px);
  background-size:34px 34px;
  animation:jgParticleDrift 32s linear infinite;
}
.jg-ambient-icons{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.jg-float-icon{position:absolute;display:block;font-size:clamp(24px,5vw,48px);opacity:.065;filter:blur(.2px);user-select:none;will-change:transform;animation:jgFloat linear infinite;}
.jg-greeting{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(231,244,238,.96),rgba(255,255,255,.96));border:1px solid rgba(14,122,79,.12);border-radius:18px;padding:15px 16px;margin:2px 0 16px;box-shadow:0 8px 24px rgba(14,122,79,.07)}
.jg-greeting .jg-greet-title{font-size:20px;font-weight:800;color:var(--g2);letter-spacing:-.2px}
.jg-greeting .jg-greet-sub{margin-top:3px;color:var(--mut);font-size:13px}
.jg-greeting::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-24px;top:-28px;background:rgba(244,181,63,.12);filter:blur(2px)}
.jg-fi1{left:6%;top:17%;animation-duration:31s;animation-delay:-8s}.jg-fi2{left:78%;top:12%;animation-duration:38s;animation-delay:-21s}.jg-fi3{left:88%;top:53%;animation-duration:34s;animation-delay:-14s}.jg-fi4{left:11%;top:69%;animation-duration:42s;animation-delay:-30s}.jg-fi5{left:48%;top:7%;animation-duration:37s;animation-delay:-19s}.jg-fi6{left:62%;top:78%;animation-duration:44s;animation-delay:-7s}.jg-fi7{left:31%;top:84%;animation-duration:35s;animation-delay:-25s}.jg-fi8{left:94%;top:82%;animation-duration:40s;animation-delay:-12s}
@keyframes jgFloat{0%{transform:translate3d(0,0,0) rotate(-4deg)}25%{transform:translate3d(22px,-18px,0) rotate(3deg)}50%{transform:translate3d(-12px,-34px,0) rotate(-2deg)}75%{transform:translate3d(-28px,-12px,0) rotate(4deg)}100%{transform:translate3d(0,0,0) rotate(-4deg)}}
@keyframes jgBgDrift{0%{transform:scale(1) translate3d(-1%,0,0)}100%{transform:scale(1.06) translate3d(1%,1%,0)}}
@keyframes jgParticleDrift{from{background-position:0 0}to{background-position:68px 52px}}
@media (prefers-reduced-motion:reduce){body::before,body::after,.jg-float-icon{animation:none!important}}
</style>

<style id="jajigo-live-auth">
/* JajiGo live login branding + loading */
.auth-logo-live{display:inline-flex;align-items:center;justify-content:center;position:relative;animation:jgLogoFloat 2.8s ease-in-out infinite;filter:drop-shadow(0 8px 14px rgba(14,122,79,.12))}
.auth-logo-live::before{content:"";position:absolute;inset:-9px;border:2px solid rgba(22,163,74,.12);border-radius:22px;animation:jgLogoPulse 2s ease-out infinite}
.auth-logo-live::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid transparent;border-top-color:rgba(255,122,0,.65);border-right-color:rgba(22,163,74,.32);animation:jgLogoSpin 3.2s linear infinite}
.auth-logo-live .brand-logo{font-size:46px;z-index:1}
.auth-loading{display:none;align-items:center;justify-content:center;gap:9px;margin-top:10px;color:var(--g2);font-size:13px;font-weight:700}
.auth-loading.show{display:flex}
.auth-loading .auth-spinner{width:18px;height:18px;border:2.5px solid rgba(14,122,79,.16);border-top-color:var(--g);border-right-color:var(--brand-orange);border-radius:50%;animation:jgLoginSpin .7s linear infinite}

async function login(loginId,password){
  const raw=String(loginId||'').trim();
  const norm=normPhone(raw);
  // Keep existing local admin/provider demo accounts working.
  const a=S.admins.find(x=>x.phone===norm);
  if(a){
    if(a.password_hash&&await shaPw(norm,password)!==a.password_hash && a.password!==password)return{ok:false,err:'Wrong phone number or password.'};
    if(a.password_hash&&await shaPw(norm,password)===a.password_hash || a.password===password){
      const remote=await apiAuth('/api/auth/login',{login:raw,password});
      if(remote.ok&&remote.user?.role==='admin')return{ok:true,role:'admin',user:remote.user,token:remote.token,remoteAdmin:true};
      return{ok:true,role:'admin',user:a,token:'local'};
    }
    return{ok:false,err:'Wrong phone number or password.'};
  }
  const p=S.providers.find(x=>(x.user_phone||x.phone)===norm);
  if(p){
    if(p.status==='suspended')return{ok:false,err:'Your business is suspended. Contact JajiGo.'};
    if(p.password_hash&&await shaPw(norm,password)===p.password_hash)return{ok:true,role:'provider',user:p,pending:p.status==='pending',token:'local'};
    if(p.password===password)return{ok:true,role:'provider',user:p,pending:p.status==='pending',token:'local'};
    return{ok:false,err:'Wrong phone number or password.'};
  }
  // Keep the built-in customer demo account working if it has not been migrated.
  const c=S.customers.find(x=>x.phone===norm);
  if(c&&raw.indexOf('@')===-1){
    if(c.password_hash&&await shaPw(norm,password)===c.password_hash)return{ok:true,role:'customer',user:c,token:'local',localCustomer:true};
    if(c.password===password)return{ok:true,role:'customer',user:c,token:'local',localCustomer:true};
  }
  const r=await apiAuth('/api/auth/login',{login:raw,password});
  if(!r.ok)return r;
  return{ok:true,role:r.user.role||'customer',user:{...r.user,uiLang:r.user.uiLang||S.uiLang||'en'},token:r.token,remoteCustomer:true};
}

/* tiny deterministic sha256-ish (browser crypto available normally) */
async function sha256Async(s){const buf=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function sha256(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return 'demo-'+(h>>>0).toString(16)}

        }catch(e){console.error('Provider registration error:',e);btn.disabled=false;btn.classList.remove('loading');initialMsg='Provider registration failed. Please try again.';render();}

        }catch(e){console.error('JajiGo auth error:',e);initialMsg='Login could not open this account. Please try again.';render();}

    }
  }

async function boot(){
  if(!U)return showAuth();
  if(U.role==='customer'){
    const c=S.customers.find(x=>String(x.id)===String(U.user?.id));
    if(c&&!U.remoteCustomer)U.user=c;
    if(!U.user)return showAuth();
    setLang(U.user.uiLang||'en');
  }
  if(U.role==='admin')return renderAdmin();
  if(U.role==='provider')return renderProvider();
  return renderApp();
}

/* ---------- Reviews ---------- */
function recomputeRatings(provider_id){
  const list=S.reviews.filter(r=>r.provider_id===provider_id);
  if(!list.length)return{avg:null,count:0};
  return{avg:Math.round(list.reduce((s,r)=>s+r.rating,0)/list.length*10)/10,count:list.length}
}

function addToCart(pid,qty){
  if(!U||U.role!=='customer')return;
  if(!S.cart_items)S.cart_items=[];
  // Multi-provider cart: products from different providers can coexist.
  const cur=S.cart_items.find(ci=>ci.cart_id===U.user.id&&ci.product_id===pid);
  if(cur)cur.quantity=Math.min(99,cur.quantity+qty);
  else S.cart_items.push({id:uid(),cart_id:U.user.id,product_id:pid,quantity:Math.min(99,qty)});
  saveState();updateBadges();
}
function getCartItems(){
  if(!U||U.role!=='customer')return [];
  return S.cart_items.filter(ci=>ci.cart_id===U.user.id).map(ci=>{
    const p=productById(ci.product_id),prov=p?providerById(p.provider_id):null;
    return {...ci,product:p,provider:prov,delivery_fee:prov?.delivery_fee||0};
  }).filter(x=>x.product&&x.provider);
}
function cartSubtotal(){return getCartItems().reduce((s,i)=>s+i.product.price*i.quantity,0)}
function groupCartByProvider(items){
  const groups=[];const map=new Map();
  items.forEach(i=>{
    const key=String(i.provider.id);
    if(!map.has(key)){const g={provider:i.provider,items:[],subtotal:0,delivery_fee:Number(i.provider.delivery_fee||0)};map.set(key,g);groups.push(g)}
    const g=map.get(key);g.items.push(i);g.subtotal+=i.product.price*i.quantity;
  });
  return groups;
}
function cartTotalDelivery(){return groupCartByProvider(getCartItems()).reduce((s,g)=>s+g.delivery_fee,0)}

function placeOrders(modes,address,phone,pm,groups,grandSubtotal){

      subtotal:g.subtotal,delivery_fee:df,total,rate,commission,provider_net:prov_net,status:'pending',payment_method:pm,payment_status:'pending',delivery_mode:mode,
      verification_code:jgNewVerifyCode(),verification_verified:false,verified_at:null,
      address:mode==='customer_pickup'?null:address,created_at:now};
    S.orders.unshift(order);created.push(order);notify('prov',g.provider.id,'🧾 New order '+code,`${g.provider.business_name} · ${money(total)}`,'new_order',order.id);
  });

const HAUSA_WORDS=['ina','bukata','abinci','shinkafa','nama','taliya','nawa','zaka','iya','me','yaya','son','sayi','zan','kudina','da','nake'];
const PIDGIN_WORDS=['abeg','wey','dey','no','pass','wetin','find','naija','sef','am','how','naija','make','cova'];
function detectLang(text){
  const s=' '+String(text).toLowerCase()+' ';
  let ha=0,pc=0;
  HAUSA_WORDS.forEach(w=>{if(s.includes(w))ha++});
  PIDGIN_WORDS.forEach(w=>{if(s.includes(w))pc++});
  if(/(ina bukatar|ina son|zan iya|me zan|abinci da|shinkafa da|in.abin)/.test(s))return'ha';
  if(/(abeg|wey no pass|wey dey|wetin)/.test(s))return'pcm';
  return ha>pc?'ha':(pc>ha?'pcm':'en');
}
function parseBudget(text){
  const s=text.toLowerCase().replace(/,/g,'');
  let m=s.match(/(?:₦|naira|ngn)\s*(\d+)/);
  if(m)return parseInt(m[1]);
  m=s.match(/(\d+)\s*(k|thousand|dubu)/);
  if(m)return parseInt(m[1])*1000;
  m=s.match(/under\s*(\d+)/);
  if(m)return parseInt(m[1]);
  m=s.match(/(\d{4,7})/);
  if(m)return parseInt(m[1]);
  return null;
}
const CAT_KEYWORDS={
  food:['food','eat','meal','lunch','dinner','jollof','rice','shawarma','spaghetti','suya','egusi','pepper soup','bread','snack','abinci','shinkafa','taliya','kusai','tuwo','naman','yaji'],

  daily_needs:['daily needs','provisions','groceries','milk','sugar','eggs','oil','detergent','garri','market','kayan gida']
};
const ITEM_KEYWORDS=[
  {re:/shawarma|shawa/i, ids:[3,11]},
  {re:/jollof/i, ids:[1,10]},
  {re:/fried\s*rice/i, ids:[2,11]},
  {re:/spaghetti|spag|taliya/i, ids:[4]},
  {re:/suya/i, ids:[8]},
  {re:/egusi/i, ids:[12]},
  {re:/pepper\s*soup/i, ids:[14]},

  {re:/rice|shinkafa/i, ids:[1,25]},
  {re:/meat|nama|beef|chicken|kaza/i, ids:[5,11]},
  {re:/haircut|aska|hair\s*cut|barbing/i, ids:[17]},
  {re:/beard/i, ids:[19]},
  {re:/car\s*wash|wanke\s*mota/i, ids:[22]},

  {re:/water|ruwa/i, ids:[16]},
  {re:/sugar|zuma|mai\s*zuma/i, ids:[37]}
];
function normalizeSearchText(s){
  return String(s||'').toLowerCase()
    .replace(/[ƙĸ]/g,'k').replace(/ɗ/g,'d').replace(/ɓ/g,'b').replace(/ƴ/g,'y')
    .replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
function cleanShopQuery(q){
  return normalizeSearchText(q).replace(/\b(please|show|me|take|go|to|open|find|search|for|the|shop|store|business|from|at|in|buy|order|get|give|want|need)\b/g,' ').replace(/\s+/g,' ').trim();
}
function shopNameScore(q,p){
  const query=normalizeSearchText(q), name=normalizeSearchText(p.business_name);
  if(!query||!name)return 0;
  const cleaned=cleanShopQuery(q);
  if(query===name)return 1000;
  if(cleaned===name)return 950;
  if(query.includes(name)&&name.length>=4)return 850;
  if(cleaned.includes(name)&&name.length>=4)return 800;
  const words=(cleaned||query).split(' ').filter(w=>w.length>1);
  const nameWords=name.split(' ').filter(w=>w.length>1);
  let score=0;
  for(const w of words){if(nameWords.includes(w))score+=180;else if(name.includes(w))score+=90;}
  const matched=nameWords.filter(w=>words.some(qw=>qw===w||qw.includes(w)||w.includes(qw))).length;
  if(nameWords.length&&matched===nameWords.length)score+=350;
  return score;
}
function findExactShop(q){
  const ranked=S.providers.filter(p=>p.status==='approved').map(p=>({p,score:shopNameScore(q,p)})).sort((a,b)=>b.score-a.score);
  return ranked[0]&&ranked[0].score>=950?ranked[0].p:null;
}
function findBestShop(q){
  const text=normalizeSearchText(q);
  const shopIntent=/\b(shop|store|business|from|at|open|go to|take me|order from|buy from)\b/i.test(text) || /\b(jaji|corner|kitchen|barber|laundry|tailor|mechanic)\b/i.test(text);
  if(!shopIntent)return null;
  const ranked=S.providers.filter(p=>p.status==='approved').map(p=>({p,score:shopNameScore(q,p)})).sort((a,b)=>b.score-a.score);
  return ranked[0]&&ranked[0].score>=420?ranked[0].p:null;
}
function aiFindProviders(q){
  const query=normalizeSearchText(q), shopQuery=cleanShopQuery(q), searchQuery=shopQuery||query;
  if(!searchQuery)return [];
  return S.providers.filter(p=>p.status==='approved').map(p=>{
    const name=normalizeSearchText(p.business_name), desc=normalizeSearchText(p.desc), custom=normalizeSearchText(p.business_type_custom);
    let score=shopNameScore(q,p);
    for(const w of searchQuery.split(' ').filter(w=>w.length>2)){
      if(name.includes(w))score+=100; if(desc.includes(w))score+=15; if(custom.includes(w))score+=20;
    }
    return {p,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>x.p).slice(0,6);
}
function aiFindProducts(q,budget,lang,providerId){
  const low=normalizeSearchText(q);
  const eligible=p=>providerById(p.provider_id)?.status==='approved'&&!!p.is_available&&(!budget||p.price<=budget)&&(!providerId||p.provider_id===providerId);
  const scored=new Map();
  const add=(p,score)=>{if(p&&eligible(p))scored.set(p.id,Math.max(scored.get(p.id)||0,score));};
  for(const it of ITEM_KEYWORDS){if(it.re.test(low))for(const id of it.ids)add(S.products.find(p=>p.id===id),700);}
  const terms=low.split(' ').filter(x=>x.length>2);
  for(const p of S.products){
    if(!eligible(p))continue;
    const name=normalizeSearchText(p.name), desc=normalizeSearchText(p.desc);
    let score=0;
    if(name===low)score=1000; else if(name&&low.includes(name))score=850; else if(name&&name.includes(low)&&low.length>2)score=800;
    for(const t of terms){if(name.split(' ').includes(t))score+=220;else if(name.includes(t))score+=100;if(desc.includes(t))score+=15;}
    if(score)add(p,score);
  }
  for(const [slug,words] of Object.entries(CAT_KEYWORDS)){
    if(words.some(w=>low.includes(normalizeSearchText(w)))){
      const cat=categoryBySlug(slug); if(cat)for(const p of S.products.filter(x=>x.category_id===cat.id))add(p,300);
    }
  }
  if(!scored.size)for(const p of S.products.filter(eligible))add(p,10);
  return [...scored.entries()].map(([id,score])=>({p:S.products.find(x=>x.id===id),score})).sort((a,b)=>b.score-a.score||(b.p.pop||0)-(a.p.pop||0)).map(x=>x.p).slice(0,6);
}
function productsForShopRequest(q){
  const text=normalizeSearchText(q);
  const hasShop=/\b(shop|store|business|from|at|open|go to|order from|buy from)\b/i.test(text) || !!findBestShop(q);
  return hasShop && S.products.some(p=>{const n=normalizeSearchText(p.name);return n.length>2&&text.includes(n);});
}
function parseQuantity(text,productName){
  const s=normalizeSearchText(text), name=normalizeSearchText(productName||''); if(!name)return 1;
  const esc=name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const patterns=[
    new RegExp('(?:qty|quantity|x)\\s*[:=]?\\s*(\\d{1,2})\\s*(?:of\\s*)?'+esc+'\\b','i'),
    new RegExp('(?:^|\\s)(\\d{1,2})\\s*(?:x\\s*)?(?:pieces?\\s+of\\s+)?'+esc+'\\b','i'),
    new RegExp(esc+'\\s*(?:x|times|quantity)\\s*(\\d{1,2})','i')
  ];
  for(const r of patterns){const m=s.match(r);if(m)return Math.max(1,Math.min(20,parseInt(m[1],10)));}
  const words={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
  const m=s.match(new RegExp('\\b('+Object.keys(words).join('|')+')\\s+(?:pieces?\\s+of\\s+)?'+esc+'\\b','i'));
  return m?words[m[1].toLowerCase()]:1;
}

function smartProductRecommendations(query=''){
  const q=normalizeSearchText(query); const now=new Date(); const hour=now.getHours();
  const products=(S.products||[]).filter(p=>p&&p.is_available&&providerById(p.provider_id)?.status==='approved');
  const recent=(S.orders||[]).filter(o=>{const d=new Date(o.created_at||0);return !['cancelled','rejected'].includes(o.status)&&((now-d)/86400000)<=1;});
  const counts={}; recent.forEach(o=>(o.items||[]).forEach(i=>counts[i.product_id]=(counts[i.product_id]||0)+Number(i.quantity||0)));
  const cheap=/cheap|afford|low budget|small money|not much|budget|kadan|arha|cheap one|cheapest/.test(q);
  const soft=/soft|easy to eat|light|smooth|taushi|mai laushi/.test(q);
  const hard=/hard|filling|heavy|strong food|mai nauyi/.test(q);
  const salty=/salty|salt|gishiri/.test(q);
  const hot=/hot|spicy|pepper|warm|zafi|yaji/.test(q);
  const tired=/tired|exhausted|hungry|starving|long day|just came back|after work|gaji|yunwa/.test(q);
  const food=/eat|food|meal|lunch|dinner|breakfast|abinci|ci/.test(q)||!q;
  const priceMin=cheap?Math.min(...products.map(p=>Number(p.price)||Infinity),5000):Infinity;
  const scored=products.map(p=>{const text=normalizeSearchText((p.name||'')+' '+(p.desc||''));let score=(counts[p.id]||0)*45+(Number(p.pop)||0)/8;
    if(cheap){score+=(Number(p.price)<=1500?90:Number(p.price)<=2500?45:Number(p.price)<=3500?10:-20);}
    if(soft&&/beans|porridge|spaghetti|rice|bread|yogurt|milk|soup|tuwo/.test(text))score+=70;
    if(hard&&/suya|yam|grilled|chicken|beef|rice/.test(text))score+=60;
    if(salty&&/suya|shawarma|fried|yaji|pepper|snack|chips/.test(text))score+=55;
    if(hot&&/suya|pepper|shawarma|grilled|spicy/.test(text))score+=70;
    if(tired&&/rice|beans|spaghetti|shawarma|bread|yam/.test(text))score+=40;
    if(food&&hour>=17&&hour<=23&&/rice|spaghetti|shawarma|beans|yam|chicken/.test(text))score+=20;
    return {...p,_smartScore:score};
  }).sort((a,b)=>b._smartScore-a._smartScore);
  return scored.slice(0,5);
}

function aiIntentCategory(text){
  const q=normalizeSearchText(text);
  const groups={
    food:['food','eat','meal','rice','jollof','fried rice','shawarma','chicken','soup','suya','beans','yam','drink','bread','abinci','shinkafa','nama','taliya','ci','yunwa','ina jin yunwa','tuwon','tuwo','dambu','miya','kunu','kosai','indomie','buka','chop','chop life','chow'],
    service:['service','repair','fix','barber','haircut','wash','mechanic','laundry','tailor','car wash','shoe','electronics','gyara','wanki','aski','dinki','mai gyara','a gyara min','ina so a gyara','barbing','salon','wash am','make you fix','fix am','service dina'],
    daily_needs:['market','provision','groceries','daily needs','eggs','oil','sugar','milk','detergent','garri','rice','bread','kayan gida'],
    other:['phone','cloth','clothes','shoe','bag','object','item','thing','kaya','abu']
  };
  let best='other',score=0;
  Object.entries(groups).forEach(([cat,words])=>{
    const n=words.reduce((a,w)=>a+(q.includes(w)?1:0),0);
    if(n>score){score=n;best=cat}
  });
  return best;
}
function aiCategorySuggestions(intent){
  const catMap={food:['food'],service:['barber','car_wash','mechanic','shoe_shiner','laundry','tailor','electronics_repair'],daily_needs:['daily_needs'],other:[]};
  let list=S.products.filter(p=>p.is_available!==0&&(catMap[intent]||[]).includes(p.cat_slug));
  if(!list.length)list=S.products.filter(p=>p.is_available!==0);
  return list.sort((a,b)=>(b.pop||0)-(a.pop||0)).slice(0,5);
}
function aiProvidersForIntent(intent){
  const slugs={food:['food'],service:['barber','car_wash','mechanic','shoe_shiner','laundry','tailor','electronics_repair'],daily_needs:['daily_needs'],other:[]};
  const ids=S.categories.filter(c=>(slugs[intent]||[]).includes(c.slug)).map(c=>c.id);
  let ps=S.providers.filter(p=>p.status==='approved'&&(ids.length?ids.includes(p.category_id):true));
  return ps.slice(0,3);
}

  function paintAnalytics(){
    const valid=S.orders.filter(o=>o.provider_id===p.id&&!['cancelled','rejected'].includes(o.status));
    const now=Date.now(), day=86400000;
    const recentStart=now-7*day, previousStart=now-14*day;
    const recent=valid.filter(o=>{const t=Date.parse(o.created_at||'');return Number.isFinite(t)&&t>=recentStart});
    const previous=valid.filter(o=>{const t=Date.parse(o.created_at||'');return Number.isFinite(t)&&t>=previousStart&&t<recentStart});
    const sumSales=list=>list.reduce((a,o)=>a+Number(o.total||0),0);
    const sales7=sumSales(recent),salesPrev=sumSales(previous),orders7=recent.length,ordersPrev=previous.length;
    const pct=(a,b)=>b===0?(a>0?100:0):Math.round(((a-b)/b)*100);
    const productStats={};
    valid.forEach(o=>(o.items||[]).forEach(i=>{
      const id=String(i.product_id), name=i.product_name||'Unknown item';
      if(!productStats[id])productStats[id]={id,name,qty7:0,qtyPrev:0,revenue7:0,totalQty:0};
      const t=Date.parse(o.created_at||'');
      const q=Number(i.quantity||0), rev=Number(i.line_total||Number(i.unit_price||0)*q);
      productStats[id].totalQty+=q;
      if(Number.isFinite(t)&&t>=recentStart){productStats[id].qty7+=q;productStats[id].revenue7+=rev}
      else if(Number.isFinite(t)&&t>=previousStart&&t<recentStart)productStats[id].qtyPrev+=q;
    }));
    const products=Object.values(productStats).sort((a,b)=>b.qty7-a.qty7||b.totalQty-a.totalQty);
    const top=products.filter(x=>x.qty7>0).slice(0,8);
    const trend=(x)=>{const d=x.qty7-x.qtyPrev;if(d>0)return `<span class="pill">📈 Up ${Math.abs(pct(x.qty7,x.qtyPrev))}%</span>`;if(d<0)return `<span class="pill red">📉 Down ${Math.abs(pct(x.qty7,x.qtyPrev))}%</span>`;return `<span class="pill amber">➡ Stable</span>`};
    const max=Math.max(1,...top.map(x=>x.qty7));
    const low=products.filter(x=>x.qtyPrev>0&&x.qty7<x.qtyPrev).sort((a,b)=>(a.qty7-a.qtyPrev)-(b.qty7-b.qtyPrev)).slice(0,5);
    $('#app').innerHTML=`<button class="btn sm sec" onclick="provView.tab='overview';renderProvider()">← Back</button>
    <h2 class="sec">📊 My Product Analytics</h2>
    <div class="mut" style="margin:-3px 0 10px">Your shop performance only. Trends compare the last 7 days with the previous 7 days.</div>
    <div class="statgrid">
      <div class="stat"><div class="sv">${orders7}</div><div class="sl">Orders · 7 days</div><div style="margin-top:5px">${pct(orders7,ordersPrev)>=0?'📈':'📉'} ${Math.abs(pct(orders7,ordersPrev))}% vs previous</div></div>
      <div class="stat"><div class="sv">${money(sales7)}</div><div class="sl">Sales · 7 days</div><div style="margin-top:5px">${pct(sales7,salesPrev)>=0?'📈':'📉'} ${Math.abs(pct(sales7,salesPrev))}% vs previous</div></div>
      <div class="stat"><div class="sv">${products.length}</div><div class="sl">Products sold</div></div>
      <div class="stat"><div class="sv">${money(valid.reduce((a,o)=>a+Number(o.total||0),0))}</div><div class="sl">All-time sales</div></div>
    </div>
    <div class="card" style="margin-top:12px"><div class="h1" style="font-size:17px">🔥 Best-selling products</div>
      ${top.length?top.map(x=>`<div style="margin-top:10px"><div class="row"><div style="min-width:0"><b>${esc(x.name)}</b><div class="mut" style="font-size:11px">${x.qty7} sold · ${money(x.revenue7)} revenue · ${x.totalQty} all-time</div></div>${trend(x)}</div><div style="height:8px;background:var(--g3);border-radius:99px;overflow:hidden;margin-top:5px"><div style="width:${Math.max(4,Math.round(x.qty7/max*100))}%;height:100%;background:var(--g);border-radius:99px"></div></div></div>`).join(''):`<div class="empty" style="padding:18px 6px"><div class="ei">📦</div>No product sales data yet.</div>`}
    </div>
    <div class="card" style="margin-top:12px"><div class="h1" style="font-size:17px">📉 Products that need attention</div>
      ${low.length?low.map(x=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><div><b>${esc(x.name)}</b><div class="mut" style="font-size:11px">${x.qtyPrev} sold previous period → ${x.qty7} sold this period</div></div><span class="pill red">📉 Down ${Math.abs(pct(x.qty7,x.qtyPrev))}%</span></div>`).join(''):`<div class="mut" style="padding-top:8px">No declining products to flag right now. Keep it up! 💪</div>`}
    </div>`;
  }
  function paintChat(){
    const threads=[...new Set(S.messages.filter(m=>m.provider_id===p.id).map(m=>m.customer_id))];
    if(!threads.length){$('#app').innerHTML='<button class="btn sm sec" onclick="provView.tab=\'overview\';renderProvider()">← Back</button><div class="empty"><div class="ei">💬</div>No chats yet.</div>';return}

  function paintComplaints(){
    const list=(S.complaints||[]).filter(c=>Number(c.provider_id)===Number(p.id)).slice().reverse();
    $('#app').innerHTML=`<button class="btn sm sec" onclick="provView.tab='overview';renderProvider()">← Back</button>
      <h2 class="sec">🆘 Complaints & Support</h2>
      <div class="mut" style="margin-bottom:10px">View customer complaints connected to your business. Reply politely so the Admin can follow the case.</div>
      ${list.length?list.map(c=>`<div class="card" style="margin-bottom:9px"><div class="row"><b>${esc(c.ticket||'Complaint')}</b><span class="pill amber">${esc(c.status||'Open')}</span></div><div class="mut" style="margin-top:4px">${esc(c.category||'Problem')} · ${(c.created_at||'').slice(0,16).replace('T',' ')}</div><div style="margin-top:7px;white-space:pre-wrap">${esc(c.description||'')}</div>${(c.messages||[]).map(m=>`<div class="bub" style="margin-top:7px;${m.role==='provider'?'background:var(--g);color:#fff;border-color:var(--g);margin-left:18px':''}"><b style="font-size:11px">${esc(m.role||'')}</b><div>${esc(m.body||'')}</div></div>`).join('')}<div class="row" style="gap:8px;margin-top:9px"><input id="pr_${esc(c.id)}" placeholder="Reply to this complaint…" style="flex:1;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px"><button class="btn sm" onclick="provReplyComplaint('${esc(c.id)}')">Reply</button></div></div>`).join(''):'<div class="empty"><div class="ei">🆘</div>No complaints connected to your business.</div>'}`;
  }
  switch(provView.tab){
    case'orders':return paintOrders();
    case'products':return paintProducts();
    case'business':return paintBusiness();
    case'commission':return paintCommission();
    case'news':return paintNews();
    case'analytics':return paintAnalytics();
    case'chat':
      if(provView.chat_cust){return paintProvChat(provView.chat_cust)}
      return paintChat();
    default:return paintDashboard();
  }
}
window.provSetStatus=function(oid,next){
  if(!U||U.role!=='provider')return toast('Provider access required.');
  const o=S.orders.find(x=>x.id===oid);if(!o||o.provider_id!==U.user.id)return toast('Order not found.');
  const ok={pending:['accepted','rejected','cancelled'],accepted:['preparing','cancelled'],preparing:['ready','cancelled'],ready:['on_the_way','delivered'],on_the_way:['delivered'],delivered:['completed']};
  if(!(ok[o.status]||[]).includes(next))return toast('Cannot change from '+o.status+' to '+next);
  o.status=next;
  notify('cust',o.customer_id,'🔄 '+o.order_code+' · '+next,`Your order is now: ${next}`,'',oid);
  saveState();toast('✅ Updated');renderProvider();
}

function compressProviderPhoto(file){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onerror=reject;
    fr.onload=()=>{
      const img=new Image();
      img.onerror=reject;
      img.onload=()=>{
        const max=800, scale=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));
        const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',0.76));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* v38 Admin recovery guard: old/corrupted local state must not leave Admin blank. */
window.openAdminSafely=function(viewName){
  try{
    if(viewName)window.adminView=viewName;
    return renderAdmin();
  }catch(err){
    console.error('JajiGo Admin error:',err);
    if(!Array.isArray(S.admins)||!S.admins.length)S.admins=__freshState.admins.slice();
    if(!Array.isArray(S.orders))S.orders=[];
    if(!Array.isArray(S.customers))S.customers=[];
    if(!Array.isArray(S.providers))S.providers=[];
    if(!Array.isArray(S.products))S.products=[];
    if(!Array.isArray(S.commission_payments))S.commission_payments=[];
    if(!Array.isArray(S.complaints))S.complaints=[];
    window.adminView='dash';saveState();
    $('#app').innerHTML='<div class="card"><div class="h1">🛡️ Admin Recovery</div><div class="mut" style="margin:8px 0">A saved-data problem was repaired. Tap below to open the dashboard again.</div><button class="btn" onclick="renderAdmin()">Open Admin Dashboard</button></div>';
  }
};

window.adminComplaintFilter=window.adminComplaintFilter||'all';
window.adminReplyComplaint=function(id){
  if(!U||U.role!=='admin')return toast('Admin access required.');
  const c=(S.complaints||[]).find(x=>x.id===id);if(!c)return;
  const input=$('#ar_'+id),body=input?.value.trim();if(!body)return toast('Write a reply first.');
  c.messages=c.messages||[];c.messages.push({id:uid(),role:'admin',body,ts:new Date().toISOString()});c.updated_at=new Date().toISOString();
  notify('cust',c.customer_id,'💬 JajiGo Customer Care · '+c.ticket,body,'complaint_reply',c.id);saveState();toast('💬 Reply sent');renderAdmin();
};
window.adminSetComplaintStatus=function(id){
  if(!U||U.role!=='admin')return toast('Admin access required.');
  const c=(S.complaints||[]).find(x=>x.id===id),sel=$('#as_'+id);if(!c||!sel)return;
  c.status=sel.value;c.updated_at=new Date().toISOString();notify('cust',c.customer_id,'🆘 '+c.ticket+' · '+c.status,`Your Customer Care ticket is now ${c.status}.`,'complaint_status',c.id);saveState();toast('✅ Status updated');renderAdmin();
};

window.adminDeletePost=function(id){
  if(!U||U.role!=='admin')return toast('Admin access required.');
  S.announcements=S.announcements.filter(x=>x.id!==id);saveState();toast('🗑️ Message deleted');renderAdmin();
};
window.adminDeleteCampaign=function(id){
  if(!U||U.role!=='admin')return toast('Admin access required.');
  S.campaigns=S.campaigns.filter(x=>x.id!==id);saveState();toast('🗑️ Campaign deleted');renderAdmin();
};


window.openAdminDashboardSafe=function(){
  if(!U||U.role!=='admin'){
    return toast('Your admin session is still active only when you are signed in as Admin.');
  }
  try{
    window.adminView='dash';
    adminView='dash';
    return renderAdmin();
  }catch(err){
    console.error('Admin dashboard navigation error:',err);
    if(U&&U.role==='admin') return toast('Could not open the Admin Dashboard. Please tap again.');

async function shaPw(norm,pw){
  // simple deterministic salted hash via SHA-256 when crypto.subtle is available; fallback to a constant label so login still works
  try{
    const buf=new TextEncoder().encode(norm+':pw:'+pw);
    const h=await crypto.subtle.digest('SHA-256',buf);
    return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){return sha256(norm+':demo:'+pw)}
}
(async function(){
  // Pre-hash the 4 demo passwords so login works
  if(!S.pwdHash)S.pwdHash={};
  const need=[
    ['customer','08011111111','demo1234'],

    ['provider_pending','08030000007','demo1234']
  ];
  for(const[k,ph,pw] of need){if(!S.pwdHash[k])S.pwdHash[k]=await shaPw(ph,pw)}
  // patch demo customer to use hashed password
  const c=S.customers.find(x=>x.phone==='08011111111');if(c&&!c.password_hash)c.password_hash=S.pwdHash['customer'];
  const a=S.admins.find(x=>x.phone==='07000000000');if(a)a.password_hash=S.pwdHash['admin'];

  };
  S.providers.forEach(p=>{const key=providerHashMap[p.phone];if(key)p.password_hash=S.pwdHash[key]});
  saveState();
  // Login uses the single shared async login() function above.
  // override requireLogin handlers
  window.useDemoImpl=async function(sel){
    const map={customer:['08011111111','demo1234'],provider_food:['08030000001','demo1234'],provider_kitchen:['08030000002','demo1234'],admin:['07000000000','admin1234']};

    saveState();boot();
  }
  // override click handlers via DOM repaint (showAuth re-reads useDemo)

  window.useDemo=window.useDemoImpl;

  // restore last session if any
  if(S.current&&S.current.token){
    // Restore the complete session object. The previous code restored only the user
    // and lost the role, which could break automatic session resume after reload.
    U={role:S.current.role,user:S.current.user,token:S.current.token,remoteCustomer:!!S.current.remoteCustomer};
    if(!U.role||!U.user)U=null;

    if(U&&U.role==='customer'&&!U.remoteCustomer){const cc=S.customers.find(x=>String(x.id)===String(U.user.id));if(cc)U.user=cc;}

  } else if(S.default_login){

  }
})();

<script id="jajigo-gemini-primary-ai-script">
/* =============================================================
   JajiGo Gemini primary AI client
   Browser -> JajiGo Gemini backend -> Gemini API
   No Gemini API key is stored in this HTML.
   This is the single AI request path used by the customer/provider/admin AI UI.
   ============================================================= */
window.JAJIGO_GEMINI_CONFIG={
  enabled:true,
  baseUrl:'https://jajigo-gemini-ai.onrender.com',
  endpoint:'/api/ai/chat',
  healthEndpoint:'/api/ai/health',
  timeoutMs:30000,
  maxHistory:6,
  sendMarketplaceContext:true,
  maxProductsContext:40,
  maxProvidersContext:20,
  maxDemandsContext:10,
  maxTextChars:700
};
window.jajigoGeminiStatus='idle';
let jajigoGeminiBusy=false;
let jajigoGoogleRenderTimer=null;

function jgGeminiStatusText(){
  const s=window.jajigoGeminiStatus;
  if(s==='online')return '🟢 Gemini AI connected';
  if(s==='connecting')return '🟡 JajiGo AI is thinking…';
  if(s==='error')return '🔴 Gemini AI unavailable';
  return '⚪ Gemini AI ready';
}
function jgGeminiUpdateStatus(){
  const el=$('#jgGeminiStatus');
  if(!el)return;
  el.className='jg-ai-primary-status '+(window.jajigoGeminiStatus||'idle');
  el.innerHTML='<i></i>'+jgGeminiStatusText();
}
function jgGeminiApiUrl(path){
  const base=String(window.JAJIGO_GEMINI_CONFIG.baseUrl||'').replace(/\/$/,'');
  return base+String(path||'');
}
function jgGeminiSafeContext(){
  const cfg=window.JAJIGO_GEMINI_CONFIG;
  const clip=(v,n=cfg.maxTextChars)=>String(v||'').replace(/\s+/g,' ').trim().slice(0,n);
  const user=U?{role:U.role,id:U.user?.id||null,name:clip(U.user?.name,80),business_name:clip(U.user?.business_name,100)}:null;

  /* Send only the fields the AI needs. Smaller JSON = faster upload + parsing. */
  const products=(S?.products||[])
    .filter(p=>p&&p.is_available!==0)
    .slice(0,cfg.maxProductsContext)
    .map(p=>({
      id:p.id,
      name:clip(p.name,90),
      description:clip(p.desc||p.description,180),
      price:Number(p.sale_price||p.price)||0,
      category:clip(p.cat_slug||p.category,60),
      provider_id:p.provider_id,
      available:true
    }));

  const providers=(S?.providers||[])
    .filter(p=>p&&p.status==='approved')
    .slice(0,cfg.maxProvidersContext)
    .map(p=>({
      id:p.id,
      name:clip(p.business_name||p.name||'Provider',100),
      category_id:p.category_id||null,
      category:clip(categoryById?.(p.category_id)?.slug,60),
      description:clip(p.desc,160),
      address:clip(p.address,120)
    }));

  const demands=(S?.ai_demands||[])
    .filter(d=>d&&d.status!=='resolved')
    .slice(0,cfg.maxDemandsContext)
    .map(d=>({query:clip(d.query,160),count:d.count||1,status:d.status||'open'}));

  return {
    app:'JajiGo Marketplace',
    language:typeof uiLang!=='undefined'?uiLang:'en',
    responseLanguage:typeof detectLang==='function'?detectLang(String($('#aiIn')?.value||'')):uiLang,
    user,
    location:clip($('#locText')?.textContent||'Jaji, Kaduna',80),
    products,
    providers,
    missingProductDemands:demands
  };
}
function jgGeminiHistory(){
  try{
    const cfg=window.JAJIGO_GEMINI_CONFIG;
    const m=getAIMemory?.()||{};
    const arr=Array.isArray(m.messages)?m.messages:[];
    const out=[];
    arr.slice(-cfg.maxHistory*2).forEach((item,i)=>{
      if(typeof item==='string'){
        out.push({role:i%2===0?'user':'model',content:String(item).slice(0,cfg.maxTextChars)});
      }else if(item&&typeof item==='object'&&item.text){
        out.push({
          role:item.role==='assistant'||item.role==='model'?'model':'user',
          content:String(item.text).replace(/\s+/g,' ').trim().slice(0,cfg.maxTextChars)
        });
      }
    });
    return out.slice(-cfg.maxHistory);
  }catch(e){return[]}
}
function jgGeminiAppend(text,kind='ai'){
  const box=$('#aiBox');if(!box)return;
  const row=document.createElement('div');row.className='msgrow '+(kind==='user'?'me':'');
  const bub=document.createElement('div');bub.className='bub';
  bub.textContent=String(text||'');row.appendChild(bub);box.appendChild(row);box.scrollTop=box.scrollHeight;
}
function jgGeminiRemember(message,reply){
  try{
    const m=getAIMemory?.()||{messages:[]};
    m.messages=(Array.isArray(m.messages)?m.messages:[]).concat([
      {role:'user',text:String(message)},
      {role:'model',text:String(reply)}
    ]).slice(-20);
    m.lastQuery=String(message);
    if(typeof aiIntentCategory==='function')m.intent=aiIntentCategory(message);
    const budget=typeof parseBudget==='function'?parseBudget(message):null;
    if(budget!=null)m.budget=budget;
    saveAIMemory?.(m);
    if(typeof remember==='function')remember(String(message));
  }catch(e){console.warn('JajiGo AI memory save skipped:',e)}
}
async function jgGeminiCall(message){
  const cfg=window.JAJIGO_GEMINI_CONFIG;
  if(!cfg.enabled)throw new Error('Gemini AI is disabled.');
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),cfg.timeoutMs);
  try{
    const payload={
      message:String(message),
      history:jgGeminiHistory(),
      language:typeof uiLang!=='undefined'?uiLang:'en',
      context:cfg.sendMarketplaceContext?jgGeminiSafeContext():undefined
    };
    const res=await fetch(jgGeminiApiUrl(cfg.endpoint),{
      method:'POST',headers:{'Content-Type':'application/json'},
      signal:controller.signal,body:JSON.stringify(payload),cache:'no-store'
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data?.error?.message||data?.error||data?.message||('HTTP '+res.status));
    if(!data||typeof data.reply!=='string'||!data.reply.trim())throw new Error('Gemini returned an empty reply.');
    return data;
  }catch(e){
    if(e?.name==='AbortError')throw new Error('Gemini AI took too long to respond. Please try again.');
    if(e instanceof TypeError)throw new Error('Could not connect to the JajiGo Gemini server. Please check your internet connection.');
    throw e;
  }finally{clearTimeout(timer)}
}
async function jgGeminiCheckHealth(){
  try{
    const ok=await jgGeminiWarmup();
    window.jajigoGeminiStatus=ok?'online':'error';
  }catch(e){window.jajigoGeminiStatus='error'}
  jgGeminiUpdateStatus();
}
let jajigoGeminiWarmPromise=null;
let jajigoGeminiWarmAt=0;
function jgGeminiWarmup(){
  const cfg=window.JAJIGO_GEMINI_CONFIG;
  if(!cfg?.enabled)return;
  const now=Date.now();
  if(jajigoGeminiWarmPromise && now-jajigoGeminiWarmAt<60000)return jajigoGeminiWarmPromise;
  jajigoGeminiWarmAt=now;
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),7000);
  jajigoGeminiWarmPromise=fetch(jgGeminiApiUrl(cfg.healthEndpoint),{
    method:'GET',cache:'no-store',signal:controller.signal
  }).then(async res=>{
    const data=await res.json().catch(()=>({}));
    if(res.ok&&data.ready){
      window.jajigoGeminiStatus='online';
      jgGeminiUpdateStatus();
      return true;
    }
    return false;
  }).catch(()=>false).finally(()=>clearTimeout(timer));
  return jajigoGeminiWarmPromise;
}

   The browser receives a Google ID credential; the JajiGo marketplace backend must
   verify that credential at POST /api/auth/google before creating a session. */
function jgGoogleBackendErrorMessage(err){
  const text=String(err?.message||err||'');
  if(/404|not found|route/i.test(text))return 'JajiGo Google sign-in is not enabled on the marketplace backend yet. Please check POST /api/auth/google on the backend.';

  if(/connect|network|fetch|failed to fetch/i.test(text))return 'JajiGo could not reach the login server. Please check your internet connection and try again.';

<!-- JajiGo SPA navigation + Android back-button repair -->
<script id="jajigo-spa-navigation-v1">
(function(){
  let restoring=false;
  let navReady=false;
  const KEY='jajigo_spa_nav_v1';

  function snapshot(){
    if(!U)return{role:null};
    if(U.role==='customer')return{role:'customer',tab:view.tab||'home',provider_id:view.provider_id||null,product_id:view.product_id||null,explore_cat:view.explore_cat||null};
    if(U.role==='provider')return{role:'provider',tab:provView.tab||'overview',chat_cust:provView.chat_cust||null};
    if(U.role==='admin')return{role:'admin',tab:window.adminView||adminView||'dash'};
    return{role:U.role};
  }
  function key(s){return JSON.stringify(s||snapshot())}
  function replaceCurrent(){
    const s=snapshot();
    history.replaceState({[KEY]:true,snapshot:s,key:key(s)},'',location.href);
    navReady=true;
  }
  function pushIfChanged(){
    if(restoring||!U)return;
    const s=snapshot(),k=key(s),cur=history.state;
    if(!navReady||!cur?.[KEY]){replaceCurrent();return;}
    if(cur.key===k)return;
    history.pushState({[KEY]:true,snapshot:s,key:k},'',location.href);
  }
  async function restore(s){
    if(!U||!s)return;
    restoring=true;
    try{
      if(s.role==='customer'&&U.role==='customer'){
        view.tab=s.tab||'home';view.provider_id=s.provider_id||null;view.product_id=s.product_id||null;view.explore_cat=s.explore_cat||null;
        await renderTab();
      }else if(s.role==='provider'&&U.role==='provider'){
        provView.tab=s.tab||'overview';provView.chat_cust=s.chat_cust||null;
        await renderProvider();
      }else if(s.role==='admin'&&U.role==='admin'){
        window.adminView=s.tab||'dash';adminView=s.tab||'dash';
        await renderAdmin();
      }else{
        // A stale state from another signed-in role should never log the user out.
        replaceCurrent();
      }
    }finally{restoring=false;replaceCurrent()}
  }

  // Customer page transitions are represented in browser history.
  const originalRenderTab=renderTab;
  renderTab=async function(){
    const result=await originalRenderTab.apply(this,arguments);
    pushIfChanged();
    return result;
  };

  // Provider and admin internal screens also get real history entries.
  const originalRenderProvider=renderProvider;
  renderProvider=async function(){
    const result=await originalRenderProvider.apply(this,arguments);
    pushIfChanged();
    return result;
  };
  const originalRenderAdmin=renderAdmin;
  renderAdmin=async function(){
    const result=await originalRenderAdmin.apply(this,arguments);
    pushIfChanged();
    return result;
  };

  // Explicit in-app Dashboard buttons should never log a signed-in admin out.
  document.addEventListener('click',function(e){
    const b=e.target.closest('button');
    if(!b||!U||U.role!=='admin')return;
    const label=(b.textContent||'').trim().toLowerCase();
    if(!label.includes('dashboard'))return;
    if(window.adminView==='dash')return;
    e.preventDefault();e.stopImmediatePropagation();
    if(document.getElementById('sheet')?.classList.contains('open')){closeSheet();return;}
    window.openAdminDashboardSafe?.();
  },true);

  // Explicit in-app Back buttons should behave like Back, not like Log out.
  document.addEventListener('click',function(e){
    const b=e.target.closest('button');
    if(!b||!U)return;
    const label=(b.textContent||'').trim().toLowerCase();
    if(!label.includes('back'))return;
    if(label.includes('back to login'))return; // Auth screen navigation is not a signed-in page.
    e.preventDefault();e.stopImmediatePropagation();
    if(document.getElementById('sheet')?.classList.contains('open')){closeSheet();return;}
    if(history.state?.[KEY]){history.back();return;}
    if(U.role==='customer'){view.tab='home';view.provider_id=null;view.product_id=null;renderTab();}
    else if(U.role==='provider'){provView.tab='overview';provView.chat_cust=null;renderProvider();}
    else if(U.role==='admin'){window.adminView='dash';adminView='dash';renderAdmin();}
  },true);

  window.addEventListener('popstate',function(e){
    // Android/browser Back closes an open sheet first, rather than touching auth state.
    const sheet=document.getElementById('sheet');
    if(sheet?.classList.contains('open')){closeSheet();replaceCurrent();return;}
    if(!U)return;
    if(e.state?.[KEY]){restore(e.state.snapshot);return;}
    // No SPA history entry: stay signed in and return to the user's home/dashboard.
    if(U.role==='customer'){view.tab='home';view.provider_id=null;view.product_id=null;view.explore_cat=null;renderTab();}
    else if(U.role==='provider'){provView.tab='overview';provView.chat_cust=null;renderProvider();}
    else if(U.role==='admin'){window.adminView='dash';adminView='dash';renderAdmin();}
    replaceCurrent();
  });

  // Establish the current page as the first SPA history entry after the app's initial boot.
  setTimeout(replaceCurrent,0);

  // If logout() is intentionally called, clear SPA history so the next Back cannot
  // resurrect an authenticated screen. Phone Back itself never calls logout().
  const originalLogout=logout;
  logout=function(){
    originalLogout.apply(this,arguments);
    setTimeout(function(){history.replaceState(null,'',location.href);navReady=false;},0);
  };
})();
</script>

<script id="jajigo-v40-draggable">
/* Drag any floating button (AI / Cart / Order) anywhere on screen. Position is remembered. */
(function(){
  const IDS=['jgFloatingAI','jgFloatingCart','jgFloatingOrder'];
  const STORE='jajigo_float_pos_v1',M=8,THRESH=7;
  let saved={};try{saved=JSON.parse(localStorage.getItem(STORE)||'{}')||{}}catch(e){}
  const persist=()=>{try{localStorage.setItem(STORE,JSON.stringify(saved))}catch(e){}};
  const VW=()=>document.documentElement.clientWidth||window.innerWidth;
  const VH=()=>window.innerHeight;
  const clamp=(v,a,b)=>Math.min(Math.max(v,a),Math.max(a,b));
  const dims=el=>({w:el.offsetWidth||56,h:el.offsetHeight||56});

  function place(el,left,top){
    const d=dims(el);
    left=clamp(left,M,VW()-d.w-M);top=clamp(top,M,VH()-d.h-M);
    el.style.setProperty('left',left+'px','important');
    el.style.setProperty('top',top+'px','important');
    el.style.setProperty('right','auto','important');
    el.style.setProperty('bottom','auto','important');
    return {left,top,d};
  }
  function restore(el){
    const p=saved[el.id];if(!p)return;
    const d=dims(el);
    place(el,M+p.x*Math.max(1,VW()-d.w-2*M),M+p.y*Math.max(1,VH()-d.h-2*M));
  }

  let st=null,lastDrag=0;
  function bind(el){
    el.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse'&&e.button!==0)return;
      const r=el.getBoundingClientRect();
      st={el,pid:e.pointerId,sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,moved:false};
      try{el.setPointerCapture(e.pointerId)}catch(_){}
    });
    el.addEventListener('pointermove',e=>{
      if(!st||st.el!==el||e.pointerId!==st.pid)return;
      if(!st.moved){
        if(Math.hypot(e.clientX-st.sx,e.clientY-st.sy)<THRESH)return;
        st.moved=true;el.classList.add('jg-dragging');
      }
      e.preventDefault();
      place(el,e.clientX-st.ox,e.clientY-st.oy);
    });
    const end=e=>{
      if(!st||st.el!==el||e.pointerId!==st.pid)return;
      if(st.moved){
        const d=dims(el),r=el.getBoundingClientRect();
        saved[el.id]={x:(r.left-M)/Math.max(1,VW()-d.w-2*M),y:(r.top-M)/Math.max(1,VH()-d.h-2*M)};
        persist();lastDrag=Date.now();el.classList.remove('jg-dragging');
      }
      try{el.releasePointerCapture(e.pointerId)}catch(_){}
      st=null;
    };
    el.addEventListener('pointerup',end);
    el.addEventListener('pointercancel',end);
    el.addEventListener('dragstart',e=>e.preventDefault());
    restore(el);
  }

  // A drag must never count as a tap (would open cart / order / AI by accident).
  document.addEventListener('click',e=>{
    if(Date.now()-lastDrag<400&&e.target.closest&&e.target.closest('#jgFloatingAI,.jg-float-action')){
      e.stopImmediatePropagation();e.preventDefault();
    }
  },true);

  function init(){IDS.forEach(id=>{const el=document.getElementById(id);if(el)bind(el)})}
  window.addEventListener('resize',()=>IDS.forEach(id=>{const el=document.getElementById(id);if(el&&el.style.left)restore(el)}));
  window.addEventListener('orientationchange',()=>setTimeout(()=>IDS.forEach(id=>{const el=document.getElementById(id);if(el&&el.style.left)restore(el)}),250));
  init();
})();
</script>

<script id="jajigo-v40-tabsync">
/* Keep the green highlight on whichever bottom tab is currently open. */
(function(){
  function paint(name){
    document.querySelectorAll('#tabs button[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  }
  function sync(){try{if(typeof view!=='undefined'&&view)paint(view.tab)}catch(e){}}
  // 1) instant feedback the moment a tab is tapped
  const nav=document.getElementById('tabs');
  if(nav)nav.addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)paint(b.dataset.tab)},true);
  // 2) after every page render (tab tap, Back button, links inside the app)
  const orig=window.renderTab;
  if(typeof orig==='function')window.renderTab=function(){
    const r=orig.apply(this,arguments);sync();
    if(r&&typeof r.then==='function')r.then(sync,sync);
    return r;
  };
  // 3) safety net
  window.addEventListener('popstate',()=>setTimeout(sync,50));
  setInterval(sync,600);
  sync();
})();
</script>

<script id="jajigo-delivery-verification-v1-script">
(function(){
  function ensureVerification(o){
    if(!o)return;
    if(!o.verification_code)o.verification_code=String(Math.floor(100000+Math.random()*900000));
    if(typeof o.verification_verified!=='boolean')o.verification_verified=false;
    if(!Object.prototype.hasOwnProperty.call(o,'verified_at'))o.verified_at=null;
  }
  (S.orders||[]).forEach(ensureVerification);
  saveState();

  // NOTE: the customer's 6-digit code is now shown from the moment the order is placed
  // (see jgCodeCard / jgShowNewOrderCodes / openOrder), so no openOrder override is needed here.

  // Provider completion is now protected by the customer's 6-digit code.
  window.provSetStatus=function(oid,next){
    if(!U||U.role!=='provider')return toast('Provider access required.');
    const o=S.orders.find(x=>x.id===oid);
    if(!o||String(o.provider_id)!==String(U.user.id))return toast('Order not found.');
    const ok={
      pending:['accepted','rejected','cancelled'],
      accepted:['preparing','cancelled'],
      preparing:['ready','cancelled'],
      ready:['on_the_way','delivered'],
      on_the_way:['delivered'],
      delivered:['completed']
    };
    if(!(ok[o.status]||[]).includes(next))return toast('Cannot change from '+o.status+' to '+next+'.');

    if(next==='completed'){
      ensureVerification(o);
      if(o.verification_verified){
        o.status='completed';
        jgNotifyOrder(o,'completed');
        saveState();updateBadges();toast('✅ Order completed');renderProvider();
        return;
      }
      openSheet(`
        <div class="h1">🔐 Verify customer delivery</div>
        <div class="mut" style="margin-top:4px">Ask the customer for the 6-digit verification code shown in their JajiGo order screen.</div>
        <div class="card" style="margin-top:12px">
          <div class="mut">Order</div><b style="font-size:17px">${esc(o.order_code)}</b>
          <div class="mut" style="margin-top:8px">Customer</div><b>${esc(o.customer_name||'Customer')}</b>
        </div>
        <div class="field" style="margin-top:12px"><label>Customer verification code</label><input id="jgVerifyInput" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="Enter 6 digits" style="font-size:22px;letter-spacing:5px;text-align:center;font-weight:900"></div>
        <button class="btn" id="jgVerifyBtn">✅ Verify & Complete Order</button>
        <button class="btn sec" style="margin-top:8px" onclick="closeSheet()">Cancel</button>`);
      $('#jgVerifyBtn').onclick=()=>{
        const code=String($('#jgVerifyInput').value||'').replace(/\D/g,'');
        if(!/^\d{6}$/.test(code))return toast('Enter the 6-digit customer code.');
        if(code!==String(o.verification_code))return toast('❌ Verification code is incorrect.');
        o.verification_verified=true;
        o.verified_at=new Date().toISOString();
        o.status='completed';
        jgNotifyOrder(o,'completed');
        saveState();updateBadges();closeSheet();toast('✅ Customer verified. Order completed.');renderProvider();
      };
      setTimeout(()=>$('#jgVerifyInput')?.focus(),60);
      return;
    }

    o.status=next;
    ensureVerification(o);
    if(next==='delivered'){
      // The code already exists, but it is now revealed to the customer.
      jgNotifyOrder(o,'delivered');
    }else if(next==='on_the_way'){
      getLiveLocation((err,pos)=>{
        if(!err){
          o.delivery_tracking={active:true,lat:pos.lat,lng:pos.lng,accuracy:pos.accuracy,updated_at:new Date().toISOString()};
          S.delivery_sessions[o.id]={active:true,provider_id:U.user.id};
          saveState();
          if(typeof trackProviderOrder==='function')trackProviderOrder(o.id);
          toast('📍 Live GPS tracking started');
        }else{
          saveState();toast('⚠️ Order is on the way. Allow GPS to start live tracking.');
        }
      });
      jgNotifyOrder(o,'on_the_way');
    }else{
      jgNotifyOrder(o,next);
    }
    saveState();updateBadges();toast('✅ '+next.replace(/_/g,' '));renderProvider();
  };

  // Make the provider's existing "Complete" action visibly explain why a code is needed.
  const oldRenderProvider=window.renderProvider;
  if(typeof oldRenderProvider==='function'){
    window.renderProvider=function(){
      return oldRenderProvider.apply(this,arguments);
    };
  }
})();
</script>
